; ============================================================================
; PlatformIO Configuration - Node 2: CSI Radar Rx, BLE, TinyML & Web Server
; Codes: T03 (BLE), T04/T05 (INT8 TinyML), T06 (ESP-NOW CSI), T07 (Web), T14 (OTA)
; Board: YoloUNO (ESP32-S3-WROOM-1, Dual-OTA Partition, USB-CDC)
; ============================================================================
[env:yolo_uno]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = ../partitions_16mb_ota.csv
lib_deps =
    WiFi
    WebServer
    HTTPClient
    Update
    BLE
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_ESP32_WIFI_CSI_ENABLED=1
    -O2
    -Wall
    -I../include
    -Iinclude
