; ============================================================================
; PlatformIO Configuration - Node 1: CSI Ping Transmitter & I2C DHT20 (T01, T06, T14)
; Board: YoloUNO (ESP32-S3-WROOM-1, Dual-OTA Partition, USB-CDC)
; ============================================================================
[env:yolo_uno]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = ../partitions_16mb_ota.csv
lib_deps =
    WiFi
    Wire
    HTTPClient
    Update
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -O2
    -Wall
    -I../include
