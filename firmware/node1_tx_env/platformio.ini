; ============================================================================
; PlatformIO Configuration - Node 1: DHT20 Sensor & ESP-NOW Transmitter (T01, T06)
; Board: YoloUNO (ESP32-S3) — Nap truc tiep qua cap USB
; ============================================================================
[env:yolo_uno]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
lib_deps =
    WiFi
    Wire
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2
    -Wall
    -I../include
