; ============================================================================
; PlatformIO Configuration - Node 2: CSI Receiver, Serial Bridge & Alarm (T06, T08)
; Board: YoloUNO (ESP32-S3) — Lightweight (no BLE, no TinyML C++, no Web Server, no OTA)
; ============================================================================
[env:yolo_uno]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
lib_deps =
    WiFi
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ESP32_WIFI_CSI_ENABLED=1
    -O2
    -Wall
    -I../include
