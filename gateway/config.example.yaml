# ============================================================================
# PC Local IoT Gateway Configuration Template (`gateway/config.example.yaml`)
# Copy to `gateway/config.yaml` when adding real tokens (ignored by .gitignore).
# Works out-of-the-box in `simulator` + Offline Mock Sync mode without hardware!
# ============================================================================

gateway:
  # "simulator" -> Chay bo gia lap 2 mach YoloUNO (khong can cam mach that)
  # "serial"    -> Doc truc tiep cong USB Serial 115200 bps tu mach YoloUNO #2 that
  source_mode: "simulator"
  serial_port: "COM4"
  serial_baudrate: 115200
  simulator_tcp_host: "127.0.0.1"
  simulator_tcp_port: 19550
  telemetry_interval_sec: 1.0
  runtime_dir: "gateway/runtime"

ai_engine:
  # Mo hinh scikit-learn Random Forest chay truc tiep tren CPU may tinh (T09)
  model_path: "ai_training/models/fall_rf_model.joblib"
  fall_threshold: 0.80

coreiot:
  host: "app.coreiot.io"
  port: 1883
  use_tls: false
  # Dien Gateway Access Token tu CoreIOT (Device co tick `IsGateway = true`)
  gateway_token: "REPLACE_WITH_YOUR_COREIOT_GATEWAY_ACCESS_TOKEN"
  node1_device_name: "YoloUNO_Node1_Tx"
  node2_device_name: "YoloUNO_Node2_Rx"
  device_profile: "Smart_Room_Fall_Profile"
  # Tu dong ghi nhat ky cuc bo (Offline Mock Sync) neu chua dien Token that
  mock_if_placeholder_token: true

telegram_alert:
  enabled: false
  bot_token: "REPLACE_WITH_TELEGRAM_BOT_TOKEN"
  chat_id: "REPLACE_WITH_FAMILY_GROUP_CHAT_ID"
  cooldown_seconds: 15.0
