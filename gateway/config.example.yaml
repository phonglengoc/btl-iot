# ============================================================================
# PC Local IoT Gateway Configuration Template (`gateway/config.example.yaml`)
# Copy to `gateway/config.yaml` when adding real tokens (ignored by .gitignore).
# Works out-of-the-box in `simulator` + `mock_coreiot` mode without hardware!
# ============================================================================

gateway:
  # "simulator" -> Run the YoloUNO #1 + #2 + BLE physics HIL simulator (no hardware required)
  # "serial"    -> Read directly from USB-CDC 921600 bps on physical YoloUNO #2
  source_mode: "simulator"
  serial_port: "COM4"
  serial_baudrate: 921600
  simulator_tcp_host: "127.0.0.1"
  simulator_tcp_port: 19550
  # Local HTTP port emulating Node 2's Embedded Web Server (T07) on PC:
  virtual_node2_http_port: 8082
  telemetry_interval_sec: 1.0
  runtime_dir: "gateway/runtime"

ai_engine:
  onnx_model_path: "ai_training/models/csi_spectrogram_2dcnn.onnx"
  tinyml_weights_path: "ai_training/models/tinyml_1dcnn_int8.npz"
  prefer_gpu_cuda: true
  edge_fusion_weight: 0.40
  gpu_fusion_weight: 0.60
  fall_fused_threshold: 0.85
  security_armed_default: true
  ble_rssi_min_default: -75

coreiot:
  host: "app.coreiot.io"
  port: 1883
  use_tls: false
  # Enter your CoreIOT Gateway Access Token (Device with `IsGateway = true`)
  gateway_token: "REPLACE_WITH_YOUR_COREIOT_GATEWAY_ACCESS_TOKEN"
  node1_device_name: "YoloUNO_Node1_Tx"
  node2_device_name: "YoloUNO_Node2_Rx"
  device_profile: "CSI_Radar_Profile"
  # Automatically fall back to local offline journal (Mock Sync) if placeholder token is unchanged
  mock_if_placeholder_token: true

telegram_alert:
  enabled: false
  bot_token: "REPLACE_WITH_TELEGRAM_BOT_TOKEN"
  chat_id: "REPLACE_WITH_FAMILY_GROUP_CHAT_ID"
  cooldown_seconds: 15.0
